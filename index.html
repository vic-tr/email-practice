<!DOCTYPE html>
<html>
<head>
<title>Classroom Email Simulator</title>
<style>
body { 
  font-family: Arial, sans-serif; 
  background:#f1f3f4; 
}

.container { 
  width:900px; 
  margin:20px auto; 
  display:flex;
  gap:20px;
}

.inbox { 
  width:35%; 
  background:white; 
  padding:15px; 
  border-radius:8px;
}

.email-list p {
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.email-list p:hover {
  background:#f1f3f4;
}

.main { 
  width:65%; 
  background:white; 
  padding:20px; 
  border-radius:8px;
}

input, textarea { 
  width:100%; 
  margin:6px 0; 
  padding:10px; 
  border:1px solid #ccc;
  border-radius:4px;
}

textarea {
  height:300px; /* Bigger writing space */
}

button { 
  background:#1a73e8; 
  color:white; 
  padding:10px 16px; 
  border:none; 
  border-radius:4px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
  <iframe src="https://h5pstudio.ecampusontario.ca/h5p/81174/embed" width="964" height="859" frameborder="0" allowfullscreen="allowfullscreen" lang="en" title="Mastering Email Communication for ESL Learners"></iframe><script src="https://h5pstudio.ecampusontario.ca/modules/contrib/h5p/vendor/h5p/h5p-core/js/h5p-resizer.js" charset="UTF-8"></script>
</div>


</body>
</html>
